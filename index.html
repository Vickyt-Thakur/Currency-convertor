<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">
</head>

<body>

    <div class="container">

        <h2>Currency Converter</h2>

        <form>

            <div>
                <p>Enter Amount</p>
                <input value="" type="text" class="inp">
            </div>

            <div class="dropdown">

                <!-- From -->

                <div class="from">
                    <p>From</p>

                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" class="from-img">

                        <select name="from" class="from">
                            <option value="USD" >USD</option>
                          
                        </select>
                    </div>
                </div>

            <!-- Arrow -->
                
                <i class="fa-solid fa-arrow-right-arrow-left" id="arrow" ></i>

                 <!-- to -->
                
                <div class="to">
                    <p>To</p>

                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" class="to-img">

                        <select name="to" class="to">
                            
                            <option value="INR" selected>INR</option>
                         
                        </select>
                    </div>
                </div>

            </div>

            <div class="msg">
            
            </div>

            <button>
                Get Exchange Rate
            </button>

        </form>

    </div>
<script src="countries.js"></script>
<script src="app.js"></script>
</body>
</html>
